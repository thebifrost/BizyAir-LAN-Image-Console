[project]
name = "bizyair-lan-image-gateway"
version = "0.1.0"
description = "Local and LAN BizyAir image generation gateway with a browser console."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Bifrost" }]
dependencies = [
  "requests>=2.31.0",
  "alibabacloud-oss-v2>=1.1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py310"
line-length = 140
extend-exclude = [
  ".agents",
  ".claude",
  ".temp",
  ".venv",
  "data",
  "logs",
]

[tool.ruff.lint]
# Conservative baseline for an existing codebase. Expand this after formatting
# and import-order cleanup have been done in a dedicated PR.
select = ["E9", "F63", "F7", "F82"]
